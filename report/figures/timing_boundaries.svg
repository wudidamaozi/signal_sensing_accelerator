xt x="1337.0" y="457.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="400" fill="#12847d">Conv3</text><line x1="1463" y1="457" x2="1485" y2="457" stroke="#12847d" stroke-width="3"/><line x1="1473" y1="449" x2="1485" y2="457" stroke="#12847d" stroke-width="3"/><line x1="1473" y1="465" x2="1485" y2="457" stroke="#12847d" stroke-width="3"/><rect x="1488" y="405" width="252" height="104" rx="8" fill="#e8f4f1" stroke="#12847d" stroke-width="2"/><text x="1614.0" y="457.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="400" fill="#12847d">GAP／FC</text><text x="380" y="550" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="400" fill="#52616d">合计5个rdcycle区间，摘要检查另计。</text><text x="35" y="641" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="41" font-weight="700" fill="#172c3b">分类硬件</text><text x="35" y="693" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#52616d">自研／hls4ml／im2col</text><rect x="380" y="611" width="1360" height="115" rx="8" fill="#e8f4f1" stroke="#12847d" stroke-width="2"/><text x="1060.0" y="668.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="400" fill="#12847d">对应基准的板内CNN计时区间</text><text x="35" y="827" dominant-baseline="central" text-anchor="start" font-family="Microsoft YaHei, sans-serif" font-size="41" font-weight="700" fill="#172c3b">占用四方</text><rect x="380" y="780" width="433" height="112" rx="8" fill="#e8f4f1" stroke="#12847d" stroke-width="2"/><text x="596.5" y="836.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="400" fill="#12847d">量化邮箱输入复制</text><line x1="813" y1=